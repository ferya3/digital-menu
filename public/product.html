<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محصول | کافه</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .p-img { position: relative; overflow: hidden; aspect-ratio: 1/1; background: linear-gradient(135deg, #efeae3, #e2d8cc); display: flex; align-items: center; justify-content: center; font-size: 4rem; }
    .p-img img { width: 100%; height: 100%; object-fit: cover; }
    .p-loc { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 12px 0; font-size: 0.88rem; }
  </style>
</head>
<body>
  <header class="app-header centered" id="appHeader">
    <span class="logo" id="cafeLogo">☕</span>
    <h1 id="cafeName">کافه</h1>
  </header>

  <div class="wrap" style="max-width:480px">
    <div class="card" id="card" style="padding:0;overflow:hidden">
      <div class="p-img" id="pImg"><span>🍽️</span></div>
      <div style="padding:18px">
        <h2 id="pName">در حال بارگذاری…</h2>
        <p class="muted" id="pDesc"></p>
        <div id="pPrice" style="font-size:1.3rem;font-weight:800;color:var(--accent);margin:10px 0"></div>
        <div class="p-loc" id="pLoc" hidden></div>
        <a class="btn primary block" id="menuLink" href="/"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg> مشاهده‌ی منوی کامل</a>
        <button class="btn block" id="shareBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg> اشتراک‌گذاری محصول</button>
        <a class="btn block" id="mapBtn" target="_blank" rel="noopener" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> مسیریابی به کافه</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/js/product.js"></script>
</body>
</html>
