<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>چاپ فاکتور</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    /* عرض استاندارد رول پرینتر حرارتی/لیبل: ۸۰ میلی‌متر (زیر ۱۰ سانت) */
    @page { size: 80mm auto; margin: 3mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 74mm;
      font-family: "Vazirmatn", Tahoma, sans-serif;
      font-size: 12px;
      color: #000;
      background: #fff;
    }
    .receipt { padding: 4px; }
    .rc-center { text-align: center; }
    .rc-logo { font-size: 22px; }
    .rc-title { font-size: 15px; font-weight: 700; margin: 2px 0; }
    .rc-sub { font-size: 11px; color: #333; }
    .rc-hr { border: none; border-top: 1px dashed #000; margin: 6px 0; }
    .rc-row { display: flex; justify-content: space-between; gap: 6px; margin: 2px 0; }
    .rc-items { width: 100%; border-collapse: collapse; }
    .rc-items th, .rc-items td { text-align: right; padding: 2px 0; font-size: 12px; }
    .rc-items th:last-child, .rc-items td:last-child { text-align: left; white-space: nowrap; }
    .rc-suborder td { font-weight: 700; font-size: 11px; color: #333; padding-top: 6px; border-top: 1px dotted #999; }
    .rc-total { font-size: 14px; font-weight: 700; }
    .rc-foot { text-align: center; font-size: 11px; margin-top: 8px; }
    .toolbar { padding: 12px; text-align: center; }
    .toolbar button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid #ccc; background: #6f4e37; color: #fff; cursor: pointer; }
    @media print { .toolbar { display: none; } body { width: auto; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">🖨️ چاپ مجدد</button>
  </div>
  <div class="receipt" id="receipt">در حال بارگذاری…</div>

  <script src="/js/print.js"></script>
</body>
</html>
