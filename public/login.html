<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود مدیر | کافه</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="gate">
    <div class="gate-card">
      <div class="gate-logo">🔒</div>
      <h2>ورود مدیریت</h2>
      <p class="muted">برای دسترسی به داشبورد، رمز عبور را وارد کنید</p>
      <input type="password" id="pass" placeholder="رمز عبور" autocomplete="current-password" />
      <button class="btn primary block" id="loginBtn">ورود</button>
      <p class="muted" id="msg" style="margin-top:10px"></p>
    </div>
  </div>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      async function login() {
        var btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'در حال ورود…';
        try {
          var res = await fetch('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: $('#pass').value }),
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || 'خطا');
          var next = new URLSearchParams(location.search).get('next') || '/manager';
          location.href = next;
        } catch (e) {
          $('#msg').textContent = e.message; $('#msg').style.color = '#e11d2a';
          btn.disabled = false; btn.textContent = 'ورود';
        }
      }
      $('#loginBtn').onclick = login;
      $('#pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
      $('#pass').focus();
    })();
  </script>
</body>
</html>
