<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>درخواست‌ها | کافه نمونه</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
</head>
<body class="staff">
  <div class="net-banner" id="netBanner" hidden>
    ⚠️ اتصال به سرور برقرار نشد. مطمئن شوید سرور با <b>npm start</b> اجراست و این صفحه را از <b>http://localhost:3000/requests</b> باز کنید (نه با باز کردن مستقیم فایل).
  </div>
  <header class="app-header">
    <div class="brand">
      <span class="logo">🛎️</span>
      <div>
        <h1>درخواست‌ها</h1>
        <span class="muted" id="connState">در حال اتصال…</span>
      </div>
    </div>
    <label class="muted" style="display:flex;gap:6px;align-items:center;color:#f3e9df">
      <input type="checkbox" id="soundToggle" checked /> صدا
    </label>
  </header>

  <main class="staff-main" style="grid-template-columns:1fr;max-width:760px">
    <section class="panel">
      <h2>🔔 درخواست گارسون و صورتحساب <span class="count" id="reqCount">۰</span></h2>
      <div id="requests"><p class="empty">درخواستی وجود ندارد</p></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/requests.js"></script>
</body>
</html>
