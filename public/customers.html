<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بانک شماره مشتری‌ها | کافه نمونه</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
  <style>
    table.db { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.db th, table.db td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line); }
    table.db th { color: var(--muted); font-weight: 700; }
    table.db td.phone { font-weight: 700; direction: ltr; text-align: right; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">📱</span>
      <h1>بانک شماره مشتری‌ها</h1>
    </div>
    <div style="display:flex;gap:8px">
      <a class="icon-btn" href="/manage" title="مدیریت محصولات" style="text-decoration:none">📋</a>
      <a class="icon-btn" href="/admin" title="تنظیمات" style="text-decoration:none">⚙️</a>
    </div>
  </header>

  <div class="net-banner" id="netBanner" hidden>
    ⚠️ اتصال به سرور برقرار نشد. این صفحه را با سرور درحال‌اجرا از <b>http://localhost:3000/customers</b> باز کنید.
  </div>

  <div class="wrap" style="max-width:820px">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <h3 style="margin:0">شماره‌های جمع‌آوری‌شده (<span id="count">۰</span>)</h3>
        <a class="btn primary small" href="/api/customers/export">⬇️ خروجی اکسل (CSV)</a>
      </div>
      <div id="list"><p class="empty">در حال بارگذاری…</p></div>
    </div>
  </div>

  <script src="/js/customers.js"></script>
</body>
</html>
